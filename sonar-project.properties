sonar.projectKey=novaria
sonar.projectName=novaria System 
sonar.sources=.

# 1. ละเว้นโฟลเดอร์ บิลด์ และไฟล์ Config
sonar.exclusions=node_modules/**, .next/**, out/**, build/**, dist/**, public/**, **/*.config.js, **/*.config.ts, **/*.json

# 2. ปิดการตรวจสอบ Code Coverage (แก้ปัญหา 0.0% Coverage)
sonar.coverage.exclusions=**/*

# 3. ข้ามการตรวจ Code ซ้ำ (Duplication) ในหน้า health และไฟล์ UI ทั้งหมด
sonar.cpd.exclusions=src/app/health/**, **/*.tsx, **/*.json

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.node.maxspace=6144